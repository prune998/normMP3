name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    name: Format, vet et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache des ffmpeg embarqués
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.4.0
        with:
          path: internal/ffmpeg/bin
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.sh') }}
      - name: Télécharge les ffmpeg à embarquer
        run: scripts/fetch-ffmpeg.sh all
      - run: make check

  build:
    name: Compilation (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache des ffmpeg embarqués
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.4.0
        with:
          path: internal/ffmpeg/bin
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.sh') }}
      - name: Télécharge le ffmpeg de la plateforme
        run: bash scripts/fetch-ffmpeg.sh host
      # Commandes go directement : les runners Windows n'ont pas make.
      - run: go build ./...
      - run: go test ./...

  packages:
    name: Paquets Windows et Linux
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Go pur : les quatre binaires se compilent depuis ce seul runner.
      - name: Cache des ffmpeg embarqués
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.4.0
        with:
          path: internal/ffmpeg/bin
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.sh') }}
      - name: Télécharge les ffmpeg à embarquer
        run: scripts/fetch-ffmpeg.sh all
      - run: make dist-windows dist-linux
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paquets-windows-linux
          path: dist/*
          retention-days: 7

  packages-macos:
    name: Paquets macOS
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache des ffmpeg embarqués
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.4.0
        with:
          path: internal/ffmpeg/bin
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.sh') }}
      - name: Télécharge les ffmpeg à embarquer
        run: scripts/fetch-ffmpeg.sh all
      - run: make dist-macos
      # Vérifie que le bundle assemblé démarre et répond.
      - name: Vérification du bundle
        run: |
          codesign --verify --verbose build/stage/macos-universal/NormMP3.app
          build/stage/macos-universal/NormMP3.app/Contents/MacOS/normmp3 -version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paquets-macos
          path: dist/*
          retention-days: 7
