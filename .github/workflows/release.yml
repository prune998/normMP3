name: Release

# Publie les paquets des cinq cibles sur un tag « v… » :
#   git tag v1.0.0 && git push origin v1.0.0
# ou manuellement depuis l'onglet Actions (champ « version »).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - id: compute
        # Sur un tag : v1.0.0 → 1.0.0. En manuel : la valeur saisie.
        run: |
          version="${{ inputs.version || github.ref_name }}"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

  windows-linux:
    name: Windows et Linux (amd64, arm64)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Ni Windows ni Linux n'utilisent cgo : les quatre binaires se
      # compilent depuis ce seul runner.
      - run: make dist-windows dist-linux VERSION=${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows-linux
          path: dist/*

  macos:
    name: macOS (Intel, Apple Silicon, universel)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Les outils Apple (lipo, codesign, ditto) sont sur le runner macOS,
      # qui compile aussi la tranche Intel (le SDK Xcode contient les deux).
      - run: make dist-macos VERSION=${{ needs.version.outputs.version }}
      - name: Vérification du bundle
        run: |
          codesign --verify --verbose build/stage/macos-universal/NormMP3.app
          build/stage/macos-universal/NormMP3.app/Contents/MacOS/normmp3 -version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-macos
          path: dist/*

  publish:
    name: Publication de la release
    needs: [version, windows-linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Empreintes SHA256
        run: cd dist && sha256sum NormMP3-* > SHA256SUMS.txt
      - name: Notes de version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: sed "s/@VERSION@/$VERSION/g" packaging/release-notes.md > notes.md
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.version.outputs.version) }}"
          gh release create "$tag" dist/* \
            --title "NormMP3 $VERSION" \
            --notes-file notes.md \
            --target "${{ github.sha }}" \
            || gh release upload "$tag" dist/* --clobber
